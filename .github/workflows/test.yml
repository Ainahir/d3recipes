# Runs the engine's tests (core/) on every push and pull request: the simulator against the golden vectors, the planner,
# and the routes played in the game.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo test --release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the page's own tests (build import, storage, search queue, rendering); they load the real wasm and data
      - run: node --test web/*.test.mjs
        working-directory: .
